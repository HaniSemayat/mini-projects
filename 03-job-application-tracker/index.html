<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Application Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <h1>💼 Job Application Tracker</h1>
            <p>Keep track of your job and internship applications.</p>
        </header>

        <section class="stats">

            <div class="stat-card">
                <span>Total</span>
                <strong id="totalApplications">0</strong>
            </div>

            <div class="stat-card">
                <span>Applied</span>
                <strong id="appliedApplications">0</strong>
            </div>

            <div class="stat-card">
                <span>Interview</span>
                <strong id="interviewApplications">0</strong>
            </div>

            <div class="stat-card">
                <span>Offers</span>
                <strong id="offerApplications">0</strong>
            </div>

        </section>

        <section class="form-section">

            <h2>Add Application</h2>

            <form id="applicationForm">

                <div class="form-row">

                    <div class="form-group">
                        <label for="company">Company</label>

                        <input
                            type="text"
                            id="company"
                            placeholder="e.g. Ethio Software"
                        >
                    </div>

                    <div class="form-group">
                        <label for="position">Position</label>

                        <input
                            type="text"
                            id="position"
                            placeholder="e.g. Backend Developer"
                        >
                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="location">Location</label>

                        <input
                            type="text"
                            id="location"
                            placeholder="e.g. Addis Ababa"
                        >
                    </div>

                    <div class="form-group">
                        <label for="date">Application Date</label>

                        <input
                            type="date"
                            id="date"
                        >
                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="status">Status</label>

                        <select id="status">
                            <option value="Applied">Applied</option>
                            <option value="Interview">Interview</option>
                            <option value="Rejected">Rejected</option>
                            <option value="Offer">Offer</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="link">Application Link</label>

                        <input
                            type="url"
                            id="link"
                            placeholder="https://example.com"
                        >
                    </div>

                </div>

                <div class="form-group">

                    <label for="notes">Notes</label>

                    <textarea
                        id="notes"
                        rows="3"
                        placeholder="Add any useful notes..."
                    ></textarea>

                </div>

                <button type="submit" class="add-btn">
                    Add Application
                </button>

            </form>

        </section>

        <section class="applications-section">

            <div class="application-header">

                <h2>Applications</h2>

                <div class="application-filters">

                    <input
                        type="search"
                        id="searchInput"
                        placeholder="Search applications..."
                    >

                    <select id="statusFilter">
                        <option value="All">All</option>
                        <option value="Applied">Applied</option>
                        <option value="Interview">Interview</option>
                        <option value="Rejected">Rejected</option>
                        <option value="Offer">Offer</option>
                    </select>

                </div>

            </div>

            <div id="applicationList">

                <p class="empty-message">
                    No applications yet.
                </p>

            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
